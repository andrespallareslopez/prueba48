<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Responsivo</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        /* Botón hamburguer */
        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            width: 30px;
            height: 20px;
            position: relative;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: white;
            margin-bottom: 4px;
        }

        /* Estilos para móvil */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                background-color: #333;
                text-align: center;
                flex-direction: column;
                align-items: center;
                padding: 2rem 0;
                transition: 0.3s ease-in-out;
            }

            .nav-links.active {
                left: 0;
            }

            .hamburger {
                display: block;
            }

            /* Animación para el menú */
            .nav-links {
                z-index: 100;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar" id="navbar">
        <div class="logo">Mi Sitio</div>
        
        <div class="nav-links" id="navLinks">
            <a href="#">Inicio</a>
            <a href="#">Sobre mí</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </div>

        <!-- Botón hamburguer -->
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Contenido de la página -->
    <main style="padding: 2rem;">
        <h1>Bienvenido a mi sitio web</h1>
        <p>Este es un ejemplo de navbar responsivo con botón hamburguer para móviles.</p>
    </main>

    <script>
        // Función para abrir/cerrar el menú en móvil
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
            
            // Cerrar menú al hacer clic fuera de él (en móviles)
            window.addEventListener('click', function(e) {
                if (!e.target.closest('.navbar') && navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
