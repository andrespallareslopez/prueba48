<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <style type="text/tailwindcss">
      /*
      @theme {
        --color-clifford: #da373d;
      }
      */
    </style>
    <title>Document</title>
</head>
<body class="bg-blue-600 font-[Poppins]">
    <span class="absolute text-white text-4xl top-5 left-4 cursor-pointer" onclick="Open()">
         <i class="bi bi-list px-2 bg-gray-900 rounded-md"></i>
    </span>
    <div class="sidebar fixed top-0 bottom-0 lg:left-0 left-[-300px] p-2 w-[300px] overflow-y-auto text-center bg-gray-900">
       <div class="text-gray-100 text-xl" >
           <div class="p-2.5 mt-1 flex items-center " >
              <i class="bi bi-app-indicator px-2 py-1 bg-blue-600 rounded-md" ></i>
              <h1 class="font-black text-gray-200 text-[15px] ml-3">MindSet</h1>
              <i class="bi bi-x ml-35 cursor-pointer lg:hidden" onclick="Open()"></i>
           </div>
           <hr class="my-2 border-gray-600" >
       </div>
       <div class="p-2.5 mt-3 flex items-center rounded-md px-4 cursor-pointer bg-gray-700 text-white" >
          <i class="bi bi-search text-sm" ></i>
          <input type="text" class="text-[15px] ml-4 bg-transparent w-full focus:outline-none" placeholder="Search" />
       </div>
       <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-500 text-white" >
          <i class="bi bi-house-door-fill" ></i>
          <span class="text-[15px] ml-4 text-gray-200" >Home</span>
       </div>
       <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-500 text-white" >
          <i class="bi bi-bookmark-fill" ></i>
          <span class="text-[15px] ml-4 text-gray-200" >Bookmark</span>
       </div>
       <hr class="my-4 border-gray-600" >
       <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-600 text-white" onclick="dropdown()">
          <i class="bi bi-chat-left-text-fill"></i>
          <div class="flex w-full justify-between items-center" >
            <span class="text-[15px] ml-4 text-gray-200">Chatbox</span>
            <span class="text-sm rotate-180" id="arrow" >
              <i class="bi bi-chevron-down"></i>
            </span>
          </div>
       </div>
       <div class="text-left text-sm font-thin mt-2 w-4/5 mx-auto text-gray-200" id="submenu">
          <h1 class="cursor-pointer p-2 hover:bg-blue-600 mt-1 rounded-md">Social</h1>
          <h1 class="cursor-pointer p-2 hover:bg-blue-600 mt-1 rounded-md">Personal</h1>
          <h1 class="cursor-pointer p-2 hover:bg-blue-600 mt-1 rounded-md">Fiends</h1>
       </div>
       <div class="p-2.5 mt-3 flex items-center rounded-md px-4 duration-300 cursor-pointer hover:bg-blue-500 text-white" >
          <i class="bi bi-box-arrow-in-right" ></i>
          <span class="text-[15px] ml-4 text-gray-200" >Logout</span>
       </div>

    </div>
    <script type="text/javascript">
        function dropdown(){
            document.querySelector('#submenu').classList.toggle('hidden');
            let element = document.querySelector('#arrow')
            if (element.classList.contains('rotate-0')) {
                
                element.classList.remove('rotate-0');
                element.classList.add('rotate-180');
            } else {
             element.classList.remove('rotate-180');   
             element.classList.add('rotate-0');
            }
        }
        dropdown();
        //document.querySelector('#submenu').addEventListener('click',dropdown);
         function Open(){
               let sidebar = document.querySelector('.sidebar');
               if (sidebar.classList.contains('left-[-300px]')) {
                  sidebar.classList.remove('left-[-300px]');
                  sidebar.classList.add('left-0');
               } else {
                  sidebar.classList.remove('left-0');
                  sidebar.classList.add('left-[-300px]');
               }
         }  
    </script>
</body>
</html>
