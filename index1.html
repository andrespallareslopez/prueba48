        function setActiveTab(view) {
            tabs.forEach((tab) => {
                const isActive = tab.dataset.view === view;
                tab.classList.toggle('bg-slate-900', isActive);
                tab.classList.toggle('text-white', isActive);
                tab.classList.toggle('border-slate-900', isActive);
                tab.classList.toggle('hover:bg-slate-100', !isActive);
            });

            Object.entries(sections).forEach(([key, section]) => {
                if (key === view) {
                    section.classList.remove('hidden');
                } else {
                    section.classList.add('hidden');
                }
            });
        }

        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                setActiveTab(tab.dataset.view);
            });
        });

            }
            self.deleteRowProject = function(){
               let newProjects = [];
               newProjects = self.projects().filter( f => f.id !== self.selectedProject().id);
               self.projects(newProjects);
               console.log(self.projects());
               
            }
            self.deleteRowMember = function(){
                let newMembers = [];
                newMembers = self.members().filter(f => f.id !== self.selectedMember().id);
                self.members(newMembers);
            }
            self.deleteRowRag = function(){
                let newRagDatabases= [];
                newRagDatabases = self.selectedMember().ragDatabases.filter(f => f.id !== self.selectedRag().id);
                self.selectedMember().ragDatabases = newRagDatabases;
                const selectedMember = self.selectedMember();
                self.selectedMember(selectedMember);
            }
            self.deleteRowTool = function(){
                let newTools = [];
                newTools = self.selectedMember().tools.filter(f =>f.id !== self.selectedTool().id);
                self.selectedMember().tools = newTools;
                const selectedMember = self.selectedMember(); 
                self.selectedMember(selectedMember); 
            }
            self.avatarClass = function (status) {
                return status === 'Activo'
                    ? 'bg-indigo-100 text-indigo-700'
                    : 'bg-slate-200 text-slate-700';
            };
            
            self.statusClass = function (status) {
                return status === 'Activo'
                    ? 'bg-emerald-50 text-emerald-700 border border-emerald-100'
                    : 'bg-slate-100 text-slate-500 border border-slate-200';
            };
            
            self.permissionClass = function (permission) {
                if (permission === 'Lectura / Escritura') {
                    return 'bg-emerald-50 text-emerald-700 border-emerald-100';
                }
                if (permission === 'Solo lectura') {
                    return 'bg-amber-50 text-amber-700 border-amber-100';
                }
                if (permission === 'Restringido') {
                    return 'bg-rose-50 text-rose-700 border-rose-100';
                }
                return 'bg-slate-50 text-slate-600 border-slate-200';
            };

            // inicialización
            if (self.projects().length > 0) {
                self.selectProject(self.projects()[0]);
            }
        }

        ko.applyBindings(new AppViewModel());
